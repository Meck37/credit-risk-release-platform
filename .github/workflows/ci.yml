# Continuous integration: runs on GitHub's machines for every push and pull request.
# Nothing here touches your laptop, your registry or real data.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, unit tests, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -e .
      - run: ruff check .
      - run: pytest -q
      - name: Known-vulnerability scan of runtime dependencies
        run: pip-audit -r requirements-serving.txt

  secrets-scan:
    name: no secrets committed (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # scan the whole history, not just the last commit
      - name: Scan full git history
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz gitleaks
          ./gitleaks git . --redact --verbose

  monitoring-config:
    name: alert rules and routing tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Alert rule unit tests (promtool)
        run: |
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v3.13.4 \
            test rules tests/alerts/alert_rules_test.yml
      - name: Alertmanager config and routing
        run: |
          sed -e 's/__PLATFORM_CHAT_ID__/111/' -e 's/__MODEL_OWNER_CHAT_ID__/222/' \
            deploy/platform/alertmanager/alertmanager.yml.tmpl > /tmp/am.yml
          AM="docker run --rm -v /tmp/am.yml:/am.yml --entrypoint amtool prom/alertmanager:v0.34.1"
          $AM check-config /am.yml
          test "$($AM config routes test --config.file=/am.yml team=model-owner)" = "model-owner"
          test "$($AM config routes test --config.file=/am.yml team=platform)" = "platform-oncall"

  image:
    name: build, run and scan the image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -e .
      - name: Build a throw-away model from synthetic data
        run: PYTHONPATH=src:. python training/build_ci_model.py
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} --build-arg MODEL_VERSION=ci -t credit-scoring:ci .
      - name: Run container and smoke test it
        run: |
          docker run -d --name api -p 8000:8000 --read-only --tmpfs /tmp credit-scoring:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health/ready && break; sleep 2; done
          curl -fsS -X POST localhost:8000/v1/score -H 'content-type: application/json' \
            -d @tests/fixtures/sample_application.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/v1/score \
            -H 'content-type: application/json' -d '{"application_id":"x"}')" = "422"
          docker logs api | tail -5
      - name: Vulnerability scan (fails on fixable CRITICAL issues)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0 \
            image --exit-code 1 --severity CRITICAL --ignore-unfixed credit-scoring:ci
