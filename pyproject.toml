[project]
name = "credit-risk-release-platform"
version = "1.0.0"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
